name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and Release Desktop App
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build -w @mail-agent/shared

      - name: Prepare Desktop Assets
        run: npm run prepare:assets -w @mail-agent/desktop

      - name: Package Desktop App (Windows)
        if: runner.os == 'Windows'
        run: npm run package:desktop:win

      - name: Package Desktop App (macOS)
        if: runner.os == 'macOS'
        run: npm run package:desktop:mac

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/desktop/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
